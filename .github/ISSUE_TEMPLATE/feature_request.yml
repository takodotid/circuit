name: Feature request
description: Something Circuit should do, or do better.
labels: ["enhancement"]
body:
    - type: textarea
      id: problem
      attributes:
          label: The problem
          description: What you're trying to do, and what gets in the way today.
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: What you'd like
          description: How it could look in a config or on the command line. A sketch is enough.
          render: ts
    - type: textarea
      id: today
      attributes:
          label: What you do today
          description: The workaround you use now, if any.
    - type: dropdown
      id: area
      attributes:
          label: Area
          options:
              - The schema, what a device file can say
              - The command line
              - A platform
              - Helpers
              - Circuit Studio
              - Integrations (NetBox, PeeringDB, LibreNMS, Prometheus)
              - Documentation or Circuit Academy
              - Something else
      validations:
          required: true
