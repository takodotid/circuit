name: pages

# Builds the documentation site in docs/ and publishes it to GitHub Pages, served at circuit.tako.id.

# Published with each stable release, so the site always describes the version on npm. DEPLOYMENT.md.
on:
    push:
        tags: ["v*", "!v*-rc.*"]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.5
            - run: bun install --frozen-lockfile
            - run: bun run docs:build
            - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
              with:
                  path: docs/.vitepress/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
