name: pages

# Builds the documentation site in docs/ and publishes it to GitHub Pages, served at circuit.tako.id.

# Published with each stable release, so the site always describes the version on npm. DEPLOYMENT.md.
on:
    push:
        tags: ["v*", "!v*-rc.*"]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            # The whole history, so each page's last-updated date, and the sitemap's, is the last commit that changed it.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.3
            - run: bun install --frozen-lockfile
            - run: bun run docs:build
            - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: docs/.vitepress/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
