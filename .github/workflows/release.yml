name: release

# A tag `vX.Y.Z` or `vX.Y.Z-rc.N`, pushed by `bun run release`, publishes the package to GitHub Packages, a GitHub release, then npm. A candidate is published under the `rc` dist-tag and marked as a prerelease. npm takes no token: the package trusts this workflow, npm Trusted Publishing.

on:
    push:
        tags: ["v*.*.*"]

permissions:
    contents: write
    packages: write
    # npm Trusted Publishing proves the workflow's identity with an OIDC token.
    id-token: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.5
            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - run: bun run test

            - name: the tag matches package.json
              run: |
                  version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
                  test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package.json $version"; exit 1; }

            - name: publish to GitHub Packages
              env:
                  NPM_CONFIG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  case "$GITHUB_REF_NAME" in
                      *-rc.*) dist_tag=rc ;;
                      *) dist_tag=latest ;;
                  esac
                  bun publish --registry https://npm.pkg.github.com --tag "$dist_tag"

            - name: GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  case "$GITHUB_REF_NAME" in
                      *-rc.*) gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease --latest=false ;;
                      *) gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --latest ;;
                  esac

            # Set the repository variable NPM_TRUSTED_PUBLISHING to true once npm trusts this workflow; until then npm is published by hand.
            - uses: actions/setup-node@v4
              if: vars.NPM_TRUSTED_PUBLISHING == 'true'
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            - name: publish to npm
              if: vars.NPM_TRUSTED_PUBLISHING == 'true'
              run: |
                  case "$GITHUB_REF_NAME" in
                      *-rc.*) dist_tag=rc ;;
                      *) dist_tag=latest ;;
                  esac
                  npx -y npm@latest publish --access public --provenance --tag "$dist_tag"
