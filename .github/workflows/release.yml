name: release

# A tag `vX.Y.Z` or `vX.Y.Z-rc.N`, pushed by `bun run release`, publishes the package to GitHub Packages, a GitHub release, then npm. A candidate is published under the `rc` dist-tag and marked as a prerelease. npm takes no token: the package trusts this workflow, npm Trusted Publishing. Each step skips what is already published, so a failed run can be run again.

on:
    push:
        tags: ["v*.*.*"]

permissions:
    contents: write
    packages: write
    # npm Trusted Publishing proves the workflow's identity with an OIDC token.
    id-token: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.5
            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - run: bun run test
            # dist/ for Node, npm and pnpm, checked by running every template's config through it with Node.
            - run: bun run build
            - run: for pattern in single-site edge-router colocation; do node dist/cli/index.js validate --config "templates/$pattern/circuit.config.ts"; done

            - name: version and dist-tag
              run: |
                  version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
                  test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package.json $version"; exit 1; }
                  case "$version" in
                      *-rc.*) dist_tag=rc ;;
                      *) dist_tag=latest ;;
                  esac
                  echo "VERSION=$version" >> "$GITHUB_ENV"
                  echo "DIST_TAG=$dist_tag" >> "$GITHUB_ENV"

            - name: publish to GitHub Packages
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_CONFIG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if gh api orgs/takodotid/packages/npm/circuit/versions --jq '.[].name' 2>/dev/null | grep -qx "$VERSION"; then
                      echo "$VERSION is already on GitHub Packages"
                  else
                      bun publish --registry https://npm.pkg.github.com --tag "$DIST_TAG"
                  fi

            - name: GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
                      echo "$GITHUB_REF_NAME is already released"
                  elif [ "$DIST_TAG" = rc ]; then
                      gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease --latest=false
                  else
                      gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --latest
                  fi

            # The repository variable NPM_TRUSTED_PUBLISHING is true once npm trusts this workflow.
            - uses: actions/setup-node@v4
              if: vars.NPM_TRUSTED_PUBLISHING == 'true'
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            - name: publish to npm
              if: vars.NPM_TRUSTED_PUBLISHING == 'true'
              run: |
                  if npm view "@takodotid/circuit@$VERSION" version > /dev/null 2>&1; then
                      echo "$VERSION is already on npm"
                  else
                      npx -y npm@latest publish --access public --provenance --tag "$DIST_TAG"
                  fi
