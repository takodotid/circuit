name: installers

# The installers, `circuit update`, the versions projects pin and `circuit uninstall`, end to end on Linux and macOS, against the
# releases on GitHub (#174). The installer's questions are answered through a terminal that `script` gives it. Runs when they change, and
# after each release.

on:
    push:
        branches: [main]
        paths:
            - docs/public/install
            - .github/workflows/installers.yml
            - src/cli/app.ts
            - src/cli/releases.ts
            - src/cli/versions.ts
    release:
        types: [published]
    workflow_dispatch:

jobs:
    installers:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        env:
            # Two releases, an older one to update from and the one after it.
            OLDER: 1.0.0-rc.7
            NEWER: 1.0.0-rc.8
            SHELL: /bin/bash
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: oven-sh/setup-bun@v2

            # The installer and Circuit read their answers from a terminal; `script` gives them one, fed from stdin. Each answer comes
            # a moment after its question, as a person's would: macOS's `script` loses what arrives before. Each answer comes
            # a moment after the question, as a person's would: macOS's `script` loses what arrives before.
            - name: a terminal for the questions
              run: |
                  if [ "$RUNNER_OS" = macOS ]; then
                      printf '#!/bin/sh\nexec script -q /dev/null "$@"\n' > /usr/local/bin/pty
                  else
                      printf '#!/bin/sh\nexec script -qec "$*" /dev/null\n' | sudo tee /usr/local/bin/pty >/dev/null
                  fi
                  sudo chmod +x /usr/local/bin/pty

            # The newest Circuit 1 or later, as the installer and `circuit update` pick it: the stable release, else the newest candidate.
            - name: the newest release
              run: |
                  tags="$(curl -fsSL https://registry.npmjs.org/-/package/@takodotid/circuit/dist-tags)"
                  tag() { printf '%s' "$tags" | sed -n "s/.*\"$1\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\".*/\1/p"; }
                  newest="$(tag latest)"
                  case "$newest" in 0.*) newest="$(tag rc)" ;; esac
                  echo "NEWEST=$newest" >> "$GITHUB_ENV"

            - name: a fresh install asks app or project, then whether to start a project
              run: |
                  cd "$(mktemp -d)"
                  # A runner may have ~/.local/bin on PATH already; a person's machine doesn't, so the installer adds it.
                  export PATH="$(printf '%s' "$PATH" | tr ':' '\n' | grep -v '/.local/bin' | paste -sd: -)"
                  { sleep 10; printf 'y\n'; sleep 40; printf 'n\n'; sleep 10; } | CIRCUIT_VERSION=$OLDER pty sh "$GITHUB_WORKSPACE/docs/public/install" | tee out.txt
                  grep -q "Added $HOME/.local/bin to PATH" out.txt
                  grep -q "Install Circuit as an app" out.txt
                  grep -q "Set up a new project in this folder" out.txt
                  test "$("$HOME/.local/bin/circuit" --version)" = "$OLDER"
                  grep -q "# Added by Circuit" "$HOME/.bashrc" "$HOME/.bash_profile" 2>/dev/null
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"

            - name: running it again asks before updating
              run: |
                  cd "$(mktemp -d)"
                  { sleep 10; printf 'n\n'; sleep 10; } | CIRCUIT_VERSION=$NEWER CIRCUIT_NO_SETUP=1 pty sh "$GITHUB_WORKSPACE/docs/public/install" | tee out.txt
                  grep -q "Kept Circuit $OLDER" out.txt
                  test "$(circuit --version)" = "$OLDER"
                  { sleep 10; printf 'y\n'; sleep 10; } | CIRCUIT_VERSION=$NEWER CIRCUIT_NO_SETUP=1 pty sh "$GITHUB_WORKSPACE/docs/public/install" | tee out.txt
                  grep -q "Circuit $NEWER is installed" out.txt
                  test "$(circuit --version)" = "$NEWER"

            - name: a fresh clone runs the version it pins, downloaded without a question in CI
              run: |
                  project="$(mktemp -d)" && cd "$project"
                  git init -q
                  printf 'export const net = circuit({});\n' > circuit.ts
                  mkdir -p .circuit && printf '%s\n' "$OLDER" > .circuit/version
                  circuit validate
                  test -x "$HOME/.circuit/versions/$OLDER/circuit"
                  echo "PROJECT=$project" >> "$GITHUB_ENV"

            - name: circuit update moves the project, and a version no project pins is removed
              run: |
                  cd "$PROJECT"
                  circuit update --confirm
                  test "$(cat .circuit/version)" = "$NEWEST"
                  circuit validate
                  test ! -e "$HOME/.circuit/versions/$OLDER"
                  circuit update --app --confirm
                  test "$(circuit --version)" = "$NEWEST"

            - name: the installed circuit updates itself before a command, and warns when it is offline
              run: |
                  # Back to the older release: without a terminal the installer never updates, so it installs afresh.
                  rm -f "$HOME/.local/bin/circuit"
                  CIRCUIT_VERSION=$OLDER CIRCUIT_NO_SETUP=1 sh "$GITHUB_WORKSPACE/docs/public/install"
                  test "$(circuit --version)" = "$OLDER"
                  cd "$PROJECT"
                  circuit validate
                  test "$(circuit --version)" = "$NEWEST"
                  # The checks it remembers for a while are forgotten, so it asks again, through a proxy that answers nothing.
                  rm -f "$HOME/.circuit/latest.json" "$HOME/.circuit/advisories.json"
                  HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9 circuit validate 2>&1 | tee offline.txt || true
                  grep -q "Could not reach the npm registry or GitHub" offline.txt

            # The release's files served from here, with one checksum changed: the installer must refuse them.
            - name: a download whose checksums are not the signed ones is refused
              run: |
                  mirror="$(mktemp -d)" && cd "$mirror"
                  asset="circuit-$( [ "$RUNNER_OS" = macOS ] && echo darwin || echo linux )-$( [ "$(uname -m)" = x86_64 ] && echo x64 || echo arm64 )"
                  base="https://github.com/takodotid/circuit/releases/download/v$NEWER"
                  for file in "$asset" SHA256SUMS SHA256SUMS.sshsig; do curl -fsSL --retry 3 -o "$file" "$base/$file"; done
                  sed "s/^[0-9a-f]\{8\}/00000000/" SHA256SUMS > tampered && mv tampered SHA256SUMS
                  (python3 -m http.server 8765 >/dev/null 2>&1 &) && sleep 2
                  sed "s|https://github.com/\$REPO/releases/download/v\$version|http://127.0.0.1:8765|" "$GITHUB_WORKSPACE/docs/public/install" > install
                  if CIRCUIT_VERSION=$NEWER CIRCUIT_NO_SETUP=1 HOME="$(mktemp -d)" sh install > out.txt 2>&1; then cat out.txt; exit 1; fi
                  cat out.txt
                  grep -q "not signed with Circuit's release key" out.txt

            # A version a security advisory affects runs nothing until the project moves: the advisory is put in Circuit's cache of them.
            - name: a project pinned to a version an advisory affects runs nothing
              run: |
                  project="$(mktemp -d)" && cd "$project"
                  printf 'export const net = circuit({});\n' > circuit.ts
                  mkdir -p .circuit && printf '%s\n' "$OLDER" > .circuit/version
                  now="$(($(date +%s) * 1000))"
                  printf '{"checked":%s,"advisories":[{"id":"GHSA-test-test-test","summary":"A test advisory","severity":"high","url":"https://example.com","affected":["= %s"],"patched":["%s"]}]}' "$now" "$OLDER" "$NEWER" > "$HOME/.circuit/advisories.json"
                  if circuit validate > out.txt 2>&1; then cat out.txt; exit 1; fi
                  cat out.txt
                  grep -q "has a security problem" out.txt
                  rm -f "$HOME/.circuit/advisories.json"

            - name: a full install puts nothing on PATH, and bun circuit runs the package's circuit
              run: |
                  cd "$(mktemp -d)"
                  bun init -y >/dev/null
                  bun add "@takodotid/circuit@$NEWER" >/dev/null
                  bun circuit --version | tee out.txt
                  grep -q "$NEWER" out.txt

            - name: circuit uninstall removes the program, the PATH line and ~/.circuit, and keeps the projects
              run: |
                  circuit uninstall --confirm
                  test ! -e "$HOME/.local/bin/circuit"
                  test ! -e "$HOME/.circuit"
                  ! grep -qs "# Added by Circuit" "$HOME/.bashrc" "$HOME/.bash_profile" "$HOME/.profile" "$HOME/.zshrc"
                  test -f "$PROJECT/circuit.ts"
