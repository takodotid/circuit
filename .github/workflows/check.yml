name: check

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # The whole history, so commitlint can read every commit of a pull request.
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.4
            - run: bun install --frozen-lockfile
            # The docs are a package of their own, which knip checks too.
            - run: bun install --cwd docs --frozen-lockfile
            - name: commit messages
              if: github.event_name == 'pull_request'
              run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
            # The same as `bun run check` locally.
            - run: bun run check
