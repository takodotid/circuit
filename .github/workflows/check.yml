name: check

on:
    pull_request:
    push:
        branches: [main]

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4
            - run: bun install --frozen-lockfile
            # The same as `bun run check` locally: typecheck, tests, format, docs build, Node build, templates on Node.
            - run: bun run check
