name: check

on:
    pull_request:
    push:
        branches: [main]

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.5
            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - run: bun run test
            - run: bun run format:check
            - run: bun run docs:build
            - run: bun run build
            - run: for pattern in single-site edge-router colocation; do node dist/cli/index.js validate --config "templates/$pattern/circuit.config.ts"; done
