name: devices

# Circuit against emulated devices (#178): three RouterOS CHRs boot in QEMU, the first's ether2 linked to the second's ether2, and its ether3 to the third's ether2. test/platforms/routeros-chr.test.ts applies to the first, test/platforms/routeros-chr-pair.test.ts runs BGP between the first two, then test/platforms/routeros-chr-reflection.test.ts makes the first a route reflector for the other two, and test/platforms/routeros-chr-vrf.test.ts runs BGP, then OSPF, between the first two in a VRF of the first. test/platforms/routeros-chr-pppoe.test.ts makes the first a PPPoE server, checked by FreeRADIUS on the runner, and the second its PPPoE client, which takes an IPv6 prefix from it, then one FreeRADIUS sends. test/platforms/routeros-chr-ipoe.test.ts makes the first a DHCP server for the other two that asks FreeRADIUS about each lease. test/platforms/routeros-chr-mpls.test.ts runs LDP across all three, then with label policies. test/platforms/routeros-chr-l3vpn.test.ts runs an L3VPN between the second and the third, across the first, then with VRF policies, and test/platforms/routeros-chr-pseudowire.test.ts a pseudowire between them, then with an MTU of its own, and a VPLS among all three. test/platforms/routeros-chr-cgnat.test.ts shares a NAT pool of the first among subscribers, the second one of them and the third the internet. test/platforms/routeros-chr-marking.test.ts has the first mark what it routes from the second to the third, which counts each DSCP and PCP, and test/platforms/routeros-chr-queues.test.ts has it schedule what it routes there by class, over the rate. test/platforms/routeros-chr-isis.test.ts runs IS-IS for IPv4 and IPv6 across all three, and test/platforms/routeros-chr-ospf-areas.test.ts OSPF, with the first the border router that sums the second's area into ranges, then over NBMA and point-to-multipoint links. test/platforms/routeros-chr-probes.test.ts has the first probe the other two, one in a VRF, and an address nothing answers. test/platforms/routeros-chr-qinq.test.ts has the first put the third's VLAN inside another with a QinQ port, under 802.1ad's TPID and then 802.1Q's, and the second end that VLAN inside the other with a VLAN interface. test/platforms/routeros-chr-large-export.test.ts gives the first a config whose export passes the 2 MiB RouterOS sends over SSH.

on:
    pull_request:
        paths:
            - src/platforms/routeros/**
            - src/platforms/bgp-wait.ts
            - src/cli/project-commands.ts
            - src/transport/**
            - test/platforms/routeros-chr*.test.ts
            - examples/edge-router/**
            - .github/workflows/devices.yml
    workflow_dispatch:

permissions:
    contents: read

jobs:
    routeros:
        runs-on: ubuntu-latest
        # The tests take about 35 minutes in all, most of it waiting for routing protocols to come up.
        timeout-minutes: 60
        env:
            # RouterOS's long-term release, and the checksum MikroTik publishes beside its CHR image.
            CHR_VERSION: 7.24.6
            CHR_SHA256: 692672e6cac9cfaa4f37c6334d07760d49e074b50befc61f0904270553f17126
            # Where the runner forwards each CHR's SSH and its REST API. The tests read CIRCUIT_TEST_CHR, CIRCUIT_TEST_CHR_B, and CIRCUIT_TEST_CHR_C.
            CIRCUIT_TEST_CHR: 127.0.0.1:2222
            CHR_REST: 127.0.0.1:8080
            CIRCUIT_TEST_CHR_B: 127.0.0.1:2223
            CHR_B_REST: 127.0.0.1:8081
            CIRCUIT_TEST_CHR_C: 127.0.0.1:2224
            CHR_C_REST: 127.0.0.1:8082
            # The user, and each CHR's management address: the edge router example's, then cpe-01's in the pair test, then the third's.
            CHR_USER: operator
            CHR_ADDRESS: 10.0.0.1/24
            CHR_B_ADDRESS: 10.0.1.1/24
            CHR_C_ADDRESS: 10.0.2.1/24
            # The TCP ports QEMU carries the links over: the first CHR to the second, and the first to the third.
            CHR_LINK: 127.0.0.1:10001
            CHR_LINK_C: 127.0.0.1:10002
            # Where the runner forwards UDP to the first CHR's port for RADIUS requests (RFC 5176), the key it shares with FreeRADIUS, and the subscribers FreeRADIUS lets in: one PPPoE subscriber, a second that it sends an IPv6 prefix for (RFC 4818), and the second CHR's ether2 by its MAC, as RouterOS's DHCP server sends it. Lab values only.
            CHR_COA: 127.0.0.1:3799
            CHR_RADIUS_SECRET: circuit-lab-secret
            CHR_SUBSCRIBER: subscriber
            CHR_SUBSCRIBER_PASSWORD: lab-subscriber
            CHR_PREFIX_SUBSCRIBER: subscriber-prefix
            CHR_RADIUS_PREFIX: 2001:db8:100:7f00::/56
            CHR_IPOE_SUBSCRIBER: 52:54:00:00:0B:02
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.5
            - run: bun install --frozen-lockfile

            # GitHub's Linux runners have KVM, open to the runner's user through a udev rule.
            - name: KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            - name: QEMU and FreeRADIUS
              run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends qemu-system-x86 freeradius freeradius-utils
            # The CHRs reach the runner from its loopback, FreeRADIUS's own client. The subscribers go first in the users file: the PPP entry after them ends the search. The DHCP server sends an empty password, so its subscriber is let in by name.
            - name: a key and the subscribers for FreeRADIUS
              run: |
                  sudo sed -i "s/testing123/$CHR_RADIUS_SECRET/" /etc/freeradius/3.0/clients.conf
                  printf '%s\n' \
                      "$CHR_SUBSCRIBER Cleartext-Password := \"$CHR_SUBSCRIBER_PASSWORD\"" \
                      "$CHR_PREFIX_SUBSCRIBER Cleartext-Password := \"$CHR_SUBSCRIBER_PASSWORD\"" \
                      "	Delegated-IPv6-Prefix = $CHR_RADIUS_PREFIX" \
                      "$CHR_IPOE_SUBSCRIBER Auth-Type := Accept" > "$RUNNER_TEMP/users"
                  sudo sh -c "cat '$RUNNER_TEMP/users' /etc/freeradius/3.0/mods-config/files/authorize > '$RUNNER_TEMP/authorize'"
                  sudo cp "$RUNNER_TEMP/authorize" /etc/freeradius/3.0/mods-config/files/authorize
                  sudo systemctl restart freeradius

            - name: the CHR image, checked against MikroTik's checksum
              working-directory: ${{ runner.temp }}
              run: |
                  curl -fsSL --retry 3 -o chr.img.zip "https://download.mikrotik.com/routeros/$CHR_VERSION/chr-$CHR_VERSION.img.zip"
                  echo "$CHR_SHA256  chr.img.zip" | sha256sum -c -
                  unzip -q chr.img.zip
                  mv "chr-$CHR_VERSION.img" chr.img
                  cp chr.img chr-b.img
                  cp chr.img chr-c.img

            # The first has four adapters: the edge router example names three, so Circuit disables the fourth. The second and the third have two. QEMU's user network serves each ether1 its management address by DHCP, and connects from .2 of it.
            # Each link is a TCP socket between two QEMUs: the first CHR listens, so it starts first. Every QEMU numbers its adapters' MACs alike, so the ends of a link get their own.
            - name: boot the CHRs
              working-directory: ${{ runner.temp }}
              run: |
                  qemu-system-x86_64 -enable-kvm -m 512 -display none -daemonize -serial file:chr-console.log \
                      -drive file=chr.img,format=raw \
                      -netdev "user,id=ether1,net=10.0.0.0/24,host=10.0.0.2,dhcpstart=${CHR_ADDRESS%/*},hostfwd=tcp:$CIRCUIT_TEST_CHR-:22,hostfwd=tcp:$CHR_REST-:80,hostfwd=udp:$CHR_COA-:3799" \
                      -device virtio-net-pci,netdev=ether1 \
                      -netdev "socket,id=ether2,listen=$CHR_LINK" -device virtio-net-pci,netdev=ether2,mac=52:54:00:00:0a:02 \
                      -netdev "socket,id=ether3,listen=$CHR_LINK_C" -device virtio-net-pci,netdev=ether3,mac=52:54:00:00:0a:03 \
                      -netdev user,id=ether4,restrict=on -device virtio-net-pci,netdev=ether4
                  qemu-system-x86_64 -enable-kvm -m 512 -display none -daemonize -serial file:chr-b-console.log \
                      -drive file=chr-b.img,format=raw \
                      -netdev "user,id=ether1,net=10.0.1.0/24,host=10.0.1.2,dhcpstart=${CHR_B_ADDRESS%/*},hostfwd=tcp:$CIRCUIT_TEST_CHR_B-:22,hostfwd=tcp:$CHR_B_REST-:80" \
                      -device virtio-net-pci,netdev=ether1 \
                      -netdev "socket,id=ether2,connect=$CHR_LINK" -device virtio-net-pci,netdev=ether2,mac=52:54:00:00:0b:02
                  qemu-system-x86_64 -enable-kvm -m 512 -display none -daemonize -serial file:chr-c-console.log \
                      -drive file=chr-c.img,format=raw \
                      -netdev "user,id=ether1,net=10.0.2.0/24,host=10.0.2.2,dhcpstart=${CHR_C_ADDRESS%/*},hostfwd=tcp:$CIRCUIT_TEST_CHR_C-:22,hostfwd=tcp:$CHR_C_REST-:80" \
                      -device virtio-net-pci,netdev=ether1 \
                      -netdev "socket,id=ether2,connect=$CHR_LINK_C" -device virtio-net-pci,netdev=ether2,mac=52:54:00:00:0c:02
                  for rest in "$CHR_REST" "$CHR_B_REST" "$CHR_C_REST"; do
                      for _ in $(seq 60); do curl -fsS -m 5 -u admin: "http://$rest/rest/system/resource" && continue 2; sleep 5; done
                      exit 1
                  done

            # As a person readies a new router: a user for Circuit, and the address the DHCP client holds set by hand, the client going first (TRAPS.md). A fresh CHR's admin has no password. The reply to the move can be lost while the address moves, so the address is checked after.
            - name: a user and a management address for Circuit, on each CHR
              run: |
                  password="$(openssl rand -hex 16)"
                  echo "::add-mask::$password"
                  echo "CIRCUIT_TEST_CHR_PASSWORD=$password" >> "$GITHUB_ENV"
                  ready() {
                      local rest="$1" address="$2"
                      curl -fsS -u admin: -X PUT "http://$rest/rest/user" -H "content-type: application/json" \
                          -d "{\"name\":\"$CHR_USER\",\"group\":\"full\",\"password\":\"$password\"}"
                      curl -sS -m 10 -u admin: -X POST "http://$rest/rest/execute" -H "content-type: application/json" \
                          -d "{\"script\":\"/ip dhcp-client remove [find]; /ip address add address=$address interface=ether1\"}" || true
                      for _ in $(seq 12); do curl -fsS -m 5 -u admin: "http://$rest/rest/ip/address?dynamic=false" | grep -q "$address" && return 0; sleep 5; done
                      return 1
                  }
                  ready "$CHR_REST" "$CHR_ADDRESS"
                  ready "$CHR_B_REST" "$CHR_B_ADDRESS"
                  ready "$CHR_C_REST" "$CHR_C_ADDRESS"

            - run: bun test test/platforms/routeros-chr.test.ts
            - run: bun test test/platforms/routeros-chr-pair.test.ts
            - run: bun test test/platforms/routeros-chr-reflection.test.ts
            - run: bun test test/platforms/routeros-chr-vrf.test.ts
            - run: bun test test/platforms/routeros-chr-vrf-services.test.ts
            - run: bun test test/platforms/routeros-chr-pppoe.test.ts
            - run: bun test test/platforms/routeros-chr-ipoe.test.ts
            - run: bun test test/platforms/routeros-chr-rate-limit.test.ts
            - run: bun test test/platforms/routeros-chr-marking.test.ts
            - run: bun test test/platforms/routeros-chr-queues.test.ts
            - run: bun test test/platforms/routeros-chr-mpls.test.ts
            - run: bun test test/platforms/routeros-chr-l3vpn.test.ts
            - run: bun test test/platforms/routeros-chr-pseudowire.test.ts
            - run: bun test test/platforms/routeros-chr-cgnat.test.ts
            - run: bun test test/platforms/routeros-chr-isis.test.ts
            - run: bun test test/platforms/routeros-chr-ospf-areas.test.ts
            - run: bun test test/platforms/routeros-chr-probes.test.ts
            - run: bun test test/platforms/routeros-chr-qinq.test.ts
            - run: bun test test/platforms/routeros-chr-large-export.test.ts

            - name: the CHRs' consoles
              if: failure()
              run: cat "$RUNNER_TEMP/chr-console.log" "$RUNNER_TEMP/chr-b-console.log" "$RUNNER_TEMP/chr-c-console.log"
