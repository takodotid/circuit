<!doctype html>
<!-- Circuit Studio. The scripts fill the parts below from /data, and draw again when the server says the config changed. -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Circuit Studio</title>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <!-- Special Gothic is shared with the documentation site, and served from beside this page so Studio works offline. -->
        <link rel="preload" href="special-gothic-latin.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="stylesheet" href="style.css" />
        <script type="module" src="app.js"></script>
    </head>
    <body>
        <header>
            <a class="brand" href="#graph" aria-label="Circuit Studio, back to the graph"
                ><span class="wordmark">Circuit</span><span class="product">Studio</span></a
            >
            <nav id="views" aria-label="Views">
                <button data-view="graph">Graph</button>
                <button data-view="devices">Devices</button>
                <button data-view="vlans">VLANs</button>
                <button data-view="addresses">Addresses</button>
                <button data-view="sessions">BGP</button>
                <button data-view="cables">Cables</button>
                <button data-view="tools">Tools</button>
                <button data-view="compare">Compare</button>
                <button data-view="problems">Problems<span id="problem-count" class="count"></span></button>
            </nav>
            <input id="search" type="search" placeholder="Search the config" aria-label="Search the config" />
            <div class="status-rail" aria-label="Network status">
                <span id="summary" class="summary"></span>
                <span id="live" class="live">connecting</span>
            </div>
        </header>

        <pre id="banner" class="banner" hidden></pre>

        <main>
            <section id="graph-view" class="view">
                <div class="toolbar">
                    <nav id="layers" aria-label="Layers"></nav>
                    <div class="actions">
                        <button id="fit" title="Fit the drawing to the window">Fit</button>
                        <button id="lay-out" title="Forget where nodes were moved, and lay them out again">Lay out again</button>
                        <details class="menu">
                            <summary>Save image</summary>
                            <div class="menu-items">
                                <button id="save-svg" title="Save this layer as an SVG image">SVG</button>
                                <button id="save-png" title="Save this layer as a PNG image">PNG</button>
                            </div>
                        </details>
                    </div>
                </div>
                <div class="stage">
                    <svg id="canvas" class="canvas" role="img" aria-label="The network">
                        <g id="viewport">
                            <g id="edges"></g>
                            <g id="nodes"></g>
                        </g>
                    </svg>
                    <aside id="panel"></aside>
                </div>
            </section>

            <section id="tables-view" class="view" hidden>
                <div id="tables" class="tables"></div>
            </section>
        </main>
    </body>
</html>
