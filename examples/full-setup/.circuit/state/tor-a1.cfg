ip route-static 0.0.0.0 0.0.0.0 10.0.99.1
#
sflow agent ip 10.0.99.6
sflow collector 1 ip 10.0.20.40 udp-port 6343
#
snmp-agent
snmp-agent sys-info version v3
snmp-agent sys-info location Site A, rack 3
snmp-agent mib-view included all iso
snmp-agent group v3 circuit privacy read-view all acl 2000
snmp-agent usm-user v3 monitor group circuit
snmp-agent usm-user v3 monitor authentication-mode sha cipher <secret:SWITCH_SNMP_AUTH>
snmp-agent usm-user v3 monitor privacy-mode aes128 cipher <secret:SWITCH_SNMP_PRIVACY>
#
stelnet server enable
ssh user operator
ssh user operator authentication-type password
ssh user operator service-type stelnet
ssh server acl 2000
ssh authorization-type default aaa
#
ssh server cipher aes256_ctr aes128_ctr
ssh server hmac sha2_256_96 sha2_256
ssh server key-exchange dh_group_exchange_sha256 ecdh_sha2_nistp256 ecdh_sha2_nistp384 ecdh_sha2_nistp521
#
user-interface con 0
 authentication-mode aaa
#
user-interface vty 0 4
 authentication-mode aaa
 protocol inbound ssh
#
