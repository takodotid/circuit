sysname core-a1
#
clock timezone Jakarta add 07:00:00
#
stp mode rstp
stp priority 4096
lldp enable
#
ntp server disable
ntp ipv6 server disable
ntp unicast-server 10.0.20.123
ntp unicast-server 10.0.20.124
#
vlan batch 10 20 99 1001 to 1008
#
telnet server disable
telnet ipv6 server disable
#
vlan 99
 name mgmt
 description Management of every device at the site
#
vlan 10
 name infra
 description OSPF between the site's routers and switches
#
vlan 20
 name services
 description Resolvers, time, logs, flows and DHCP
#
vlan 1001
 name acme
 description Customer acme
#
vlan 1002
 name globex
 description Customer globex
#
vlan 1003
 name initech
 description Customer initech
#
vlan 1004
 name vandelay
 description Customer vandelay
#
vlan 1005
 name soylent
 description Customer soylent
#
vlan 1006
 name cyberdyne
 description Customer cyberdyne
#
vlan 1007
 name tyrell
 description Customer tyrell
#
vlan 1008
 name wonka
 description Customer wonka
#
acl number 2000
 description Management access
 rule 5 permit source 10.0.99.0 0.0.0.255
 rule 10 permit source 10.1.99.0 0.0.0.255
 rule 15 permit source 10.254.2.0 0.0.0.255
 rule 20 deny
#
aaa
 local-user operator password irreversible-cipher <secret:SWITCH_OPERATOR_PASSWORD>
 local-user operator service-type ssh
 local-user operator level 3
#
interface Eth-Trunk1
 description core-a2
 mode lacp-static
 port link-type trunk
 undo port trunk allow-pass vlan 1
 port trunk allow-pass vlan 10 20 99 1001 to 1008
#
interface Eth-Trunk2
 description tor-a3
 mode lacp-static
 port link-type trunk
 undo port trunk allow-pass vlan 1
 port trunk allow-pass vlan 99 1001 to 1008
#
interface Vlanif99
 ip address 10.0.99.4 255.255.255.0
 dhcp select relay
 dhcp relay binding server ip 10.0.20.67
#
interface Vlanif10
 ip address 10.0.10.4 255.255.255.0
 ospf cost 10
 ospf bfd enable
#
interface Vlanif20
 ip address 10.0.20.2 255.255.255.0
 vrrp vrid 20 virtual-ip 10.0.20.1
 vrrp vrid 20 priority 200
#
interface 10GE1/0/1
 description Resolver 1
 port default vlan 20
 stp edged-port enable
 storm control broadcast min-rate percent 1 max-rate percent 1
 storm control multicast min-rate percent 1 max-rate percent 1
 storm control action suppress
 storm control enable trap
 storm control enable log
#
interface 10GE1/0/2
 description Time server 1
 port default vlan 20
 stp edged-port enable
 storm control broadcast min-rate percent 1 max-rate percent 1
 storm control multicast min-rate percent 1 max-rate percent 1
 storm control action suppress
 storm control enable trap
 storm control enable log
#
interface 10GE1/0/3
 description Log collector
 port default vlan 20
 stp edged-port enable
 storm control broadcast min-rate percent 1 max-rate percent 1
 storm control multicast min-rate percent 1 max-rate percent 1
 storm control action suppress
 storm control enable trap
 storm control enable log
#
interface 10GE1/0/4
 description Flow collector
 port default vlan 20
 stp edged-port enable
 storm control broadcast min-rate percent 1 max-rate percent 1
 storm control multicast min-rate percent 1 max-rate percent 1
 storm control action suppress
 storm control enable trap
 storm control enable log
 lldp disable
