StylesPath = .vale/styles
MinAlertLevel = warning
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.2/Google.zip
Vocab = Circuit

[formats]
vue = html

[*.md]
BasedOnStyles = Vale, Google, Circuit
Google.Acronyms = NO
Google.Headings = NO
Google.Quotes = NO
Google.WordList = NO

# The Academy is checked, but its rewrite is planned work, so nothing in it fails yet.
[docs/academy/**/*.md]
Circuit.Dashes = warning
Circuit.PlainWords = warning
Circuit.VeryLongSentence = warning
Vale.Spelling = warning
Vale.Terms = warning
Google.AMPM = warning
Google.DateFormat = warning
Google.Exclamation = warning
Google.Gender = warning
Google.GenderBias = warning
Google.Latin = warning
Google.LyHyphens = warning
Google.OptionalPlurals = warning
Google.Ordinal = warning
Google.Periods = warning
Google.Slang = warning
Google.Spacing = warning
Google.Units = warning

# Comments in code, and the text of Studio's pages.
[*.{ts,vue}]
BasedOnStyles = Circuit

# Not prose: a data table, and standard texts kept word for word.
[{design/coverage.md,CODE_OF_CONDUCT.md}]
BasedOnStyles =
