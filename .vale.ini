StylesPath = .vale/styles
MinAlertLevel = warning
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.2/Google.zip
Vocab = Circuit

[formats]
vue = html

[*.md]
BasedOnStyles = Vale, Google, Circuit
# Fixed terms that Google's ordinal and first-person rules misread, and the paths of files a page includes.
TokenIgnores = (?i)\b\d+th percentile\b, (?i)\bmeet-me rooms?\b, <<< @/\S+
Google.Acronyms = NO
Google.OxfordComma = error
Google.Spelling = NO
Google.Headings = NO
Google.Quotes = NO
Google.WordList = NO

# Comments in code, and the text of Studio's pages. In a .ts file Vale checks words but not sentences: test/repo.test.ts checks their length.
[*.{ts,vue}]
BasedOnStyles = Circuit
Circuit.SentenceLength = error
Google.OxfordComma = error

# A standard text, kept word for word.
[CODE_OF_CONDUCT.md]
BasedOnStyles =

